<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineReseñas</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header>
      <div class="header-content">
        <h1>🎬 CineReseñas</h1>
        <nav>
          <a href="/index.html">Inicio</a>
          <a href="/login.html" id="nav-login">Login Admin</a>
          <span id="nav-admin" style="display:none">
            <a href="/admin.html">Panel Admin</a>
            <button id="btn-logout" onclick="logout()">Cerrar sesión</button>
          </span>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero">
        <h2>Comparte tu opinión sobre las películas que amas</h2>
        <p>Lee y escribe reseñas de la comunidad cinéfila.</p>
      </section>

      <!-- Formulario para nueva reseña -->
      <section class="card">
        <h3>✍️ Escribe una Reseña</h3>
        <form id="form-review">
          <div class="form-group">
            <label for="movie">Película</label>
            <input type="text" id="movie" placeholder="Nombre de la película" required />
          </div>
          <div class="form-group">
            <label for="author">Tu nombre</label>
            <input type="text" id="author" placeholder="Tu nombre" required />
          </div>
          <div class="form-group">
            <label for="text">Reseña</label>
            <textarea id="text" rows="4" placeholder="Escribe tu reseña aquí..." required></textarea>
          </div>
          <div class="form-group">
            <label for="rating">Puntuación</label>
            <select id="rating">
              <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
              <option value="4">⭐⭐⭐⭐ (4/5)</option>
              <option value="3">⭐⭐⭐ (3/5)</option>
              <option value="2">⭐⭐ (2/5)</option>
              <option value="1">⭐ (1/5)</option>
            </select>
          </div>
          <button type="submit" class="btn-primary">Publicar Reseña</button>
        </form>
        <div id="form-msg" class="msg" style="display:none"></div>
      </section>

      <!-- Lista de reseñas -->
      <section>
        <h3>📋 Reseñas de la Comunidad</h3>
        <div id="reviews-container">
          <p class="loading">Cargando reseñas...</p>
        </div>
      </section>
    </main>

    <footer>
      <p>CineReseñas &copy; 2026 — Proyecto pedagógico de seguridad web</p>
    </footer>

    <script src="/js/auth.js"></script>
    <script src="/js/main.js"></script>
  </body>
</html>
